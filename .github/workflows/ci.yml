name: Validate Data & Calculator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit and schema tests
        run: python3 -m unittest discover -s tests -v
      - name: Smoke test CLI
        run: python3 hosting_finder.py --months 36 --max-budget 10 --us-only
